<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRPsi - Registro Clínico Estruturado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --color-primary:#025e8d;--color-primary-hover:#024b70;--color-primary-deep:#013e5d;
  --color-primary-light:#025e8d1a;--color-primary-shadow:#025e8d33;
  --color-accent:#38bdf8;--color-success:#10b981;--color-success-light:#ecfdf5;--color-success-text:#065f46;
  --color-warning:#f59e0b;--color-warning-light:#fffbeb;--color-warning-text:#92400e;
  --color-error:#ef4444;--color-error-light:#fef2f2;--color-error-text:#991b1b;
  --color-bg:#F0F2F5;--color-bg-card:#fff;--color-bg-content:#F8FAFC;
  --color-border:#e2e8f0;--color-border-light:#f1f5f9;
  --color-text-primary:#0f172a;--color-text-secondary:#475569;--color-text-muted:#94a3b8;
  --font-sans:"Inter",system-ui,-apple-system,sans-serif;
}
body.dark{
  --color-bg-content:#0f172a;--color-bg-card:#1e293b;--color-bg:#0a0f1a;
  --color-border:#334155;--color-border-light:#1e293b;
  --color-text-primary:#f1f5f9;--color-text-secondary:#94a3b8;--color-text-muted:#64748b;
  --color-primary-light:#025e8d33;
}
body.dark .sidebar{background:#1e293b;border-color:#334155}
body.dark .sidebar-header{background:#1e293b}
body.dark .topbar{background:#1e293b;border-color:#334155}
body.dark .main{background:#0f172a}
body.dark .content{background:#0f172a}
body.dark .card{background:#1e293b;border-color:#334155}
body.dark .search-input{background:#1e293b;border-color:#334155;color:#f1f5f9}
body.dark .form-input,body.dark .form-select,body.dark .form-textarea{background:#1e293b;border-color:#334155;color:#f1f5f9}
body.dark .nav-item:hover{background:#334155}
body.dark .btn-outline{background:#1e293b;border-color:#334155;color:#cbd5e1}
body.dark .btn-outline:hover{background:#334155}
body.dark .patient-card:hover{background:#334155}
body.dark .section-panel{background:#1e293b}
body.dark .scale-item{background:#1e293b;border-color:#334155}
body.dark .chat-bubble-assistant{background:#1e293b;border-color:#334155}
body.dark .chat-input-wrap{background:#1e293b;border-color:#334155}
body.dark .chat-input{background:#0f172a;color:#f1f5f9;border-color:#334155}
body.dark .tab-btn:not(.active){background:#1e293b;color:#94a3b8;border-color:#334155}
body.dark .pts-row{background:#1e293b;border-color:#334155}
body.dark .goal-item{background:#1e293b;border-color:#334155}
body.dark .report-preview{background:#1e293b;color:#f1f5f9;border-color:#334155}
body.dark .upload-zone{background:#1e293b;border-color:#334155}
body.dark .audit-item{background:#1e293b;border-color:#334155}
body.dark .collapsible-header{background:#1e293b}
body.dark .collapsible-header:hover{background:#334155}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--color-bg-content);color:var(--color-text-primary);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.app{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sidebar{width:280px;background:var(--color-bg-card);display:flex;flex-direction:column;flex-shrink:0;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);border-right:1px solid #e5e7eb;z-index:30;transition:width .3s,transform .3s}
.sidebar-header{padding:1.25rem;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;background:#f8fafc;min-height:4rem}
body.dark .sidebar-header{border-color:#334155}
.logo-btn{display:flex;align-items:center;gap:.75rem;background:none;border:none;cursor:pointer;transition:transform .1s}
.logo-btn:active{transform:scale(.95)}
.logo-icon{position:relative;display:flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;background:linear-gradient(to bottom right,#025e8d,#013e5d);color:#fff;border-radius:.75rem;box-shadow:0 10px 15px -3px rgba(2,94,141,.2)}
.logo-text{font-weight:900;font-size:1.5rem;color:#025e8d;line-height:1;letter-spacing:-.05em}
.sidebar-nav{flex:1;overflow-y:auto;padding:1rem .75rem;display:flex;flex-direction:column;gap:.375rem}
.nav-item{width:100%;display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:.75rem;border:none;background:none;cursor:pointer;font-family:inherit;font-size:.95rem;color:var(--color-text-secondary);transition:all .2s;text-align:left}
.nav-item:hover{background:#f1f5f9}
.nav-item.active{background:var(--color-primary);color:#fff;box-shadow:0 10px 15px -3px rgba(2,94,141,.2);font-weight:700}
.nav-item svg{flex-shrink:0}
.sidebar-footer{padding:.75rem;border-top:1px solid #f3f4f6;display:flex;flex-direction:column;gap:.25rem}
body.dark .sidebar-footer{border-color:#334155}
.footer-item{width:100%;display:flex;align-items:center;gap:.75rem;padding:.625rem 1rem;border-radius:.75rem;border:none;background:none;cursor:pointer;font-family:inherit;font-size:.7rem;font-weight:700;letter-spacing:.05em;color:#64748b;transition:all .2s;text-align:left;text-transform:uppercase}
.footer-item:hover{background:#f1f5f9}
body.dark .footer-item:hover{background:#334155}
.footer-item.danger{color:#ef4444}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-bg-card)}
.topbar{background:var(--color-bg-card);border-bottom:1px solid var(--color-border);padding:1rem;display:flex;justify-content:space-between;align-items:center;z-index:20;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:1rem}
.menu-toggle{background:none;border:none;cursor:pointer;color:#64748b;padding:.25rem;border-radius:.5rem;display:flex}
.menu-toggle:hover{background:#f1f5f9}
body.dark .menu-toggle:hover{background:#334155}
.page-title{font-size:1.5rem;font-weight:700;color:var(--color-primary)}
.topbar-right{display:flex;align-items:center;gap:1rem}
.brand-block{display:flex;flex-direction:column;align-items:flex-end}
.brand-line{font-size:10px;font-weight:700;color:var(--color-primary);text-transform:uppercase;letter-spacing:.1em}
.brand-sub{display:flex;align-items:center;gap:.5rem;margin-top:.125rem}
.brand-version{font-size:9px;color:#6b7280;font-family:monospace}
.status-pill{display:flex;align-items:center;gap:.375rem;padding:.125rem .5rem;border-radius:9999px;background:#f1f5f9;border:1px solid #e2e8f0}
body.dark .status-pill{background:#1e293b;border-color:#334155}
.status-dot{width:.375rem;height:.375rem;border-radius:9999px;background:#10b981;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{font-size:9px;font-weight:700;color:#4b5563}
body.dark .status-text{color:#94a3b8}
.icon-btn{padding:.5rem;background:none;border:none;cursor:pointer;border-radius:9999px;color:#64748b;display:flex;transition:background .2s}
.icon-btn:hover{background:#f1f5f9}
body.dark .icon-btn:hover{background:#334155}
.avatar-btn{width:2.25rem;height:2.25rem;border-radius:9999px;background:#f1f5f9;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#64748b}
body.dark .avatar-btn{background:#334155;border-color:#475569}
.content{flex:1;overflow-y:auto;padding:2rem;background:var(--color-bg-content);scroll-behavior:smooth}
/* CARDS & BUTTONS */
.card{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:1rem;padding:1.5rem;transition:box-shadow .2s}
.content-head{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
.content-title{font-size:1.875rem;font-weight:800;color:var(--color-text-primary);flex:1}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.625rem 1.25rem;border-radius:.75rem;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .2s}
.btn-sm{padding:.4rem .875rem;font-size:.85rem}
.btn-outline{background:var(--color-bg-card);border-color:var(--color-border);color:#334155}
.btn-outline:hover{background:#f8fafc;border-color:#cbd5e1}
.btn-primary{background:var(--color-primary);color:#fff;box-shadow:0 4px 6px -1px rgba(2,94,141,.2)}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-success{background:#10b981;color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.search-wrap{position:relative;margin-bottom:1.5rem}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:#94a3b8}
.search-input{width:100%;padding:.875rem 1rem .875rem 3rem;border:1px solid var(--color-border);border-radius:.75rem;font-family:inherit;font-size:1rem;color:var(--color-text-primary);background:var(--color-bg-card);outline:none;transition:border-color .2s,box-shadow .2s}
.search-input::placeholder{color:#94a3b8}
.search-input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-shadow)}
.empty-state{text-align:center;color:#94a3b8;padding:4rem 1rem;font-size:1rem}
/* PATIENT CARDS */
.patients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}
.patient-card{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:1rem;padding:1.25rem;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:.75rem}
.patient-card:hover{box-shadow:0 10px 30px rgba(2,94,141,.12);border-color:var(--color-primary);transform:translateY(-2px)}
.patient-card-header{display:flex;justify-content:space-between;align-items:flex-start}
.patient-name{font-weight:700;font-size:1.05rem;color:var(--color-text-primary)}
.patient-age{font-size:.85rem;color:var(--color-text-muted)}
.badge{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.75rem;font-weight:700}
.badge-primary{background:var(--color-primary-light);color:var(--color-primary)}
.badge-success{background:#ecfdf5;color:#065f46}
.badge-warning{background:#fffbeb;color:#92400e}
.badge-error{background:#fef2f2;color:#991b1b}
.badge-gray{background:#f1f5f9;color:#475569}
.patient-meta{display:flex;gap:.75rem;flex-wrap:wrap}
.patient-meta-item{display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:var(--color-text-secondary)}
/* FORM */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.form-group{display:flex;flex-direction:column;gap:.375rem}
.form-group.full{grid-column:1/-1}
.form-label{font-size:.875rem;font-weight:600;color:var(--color-text-secondary)}
.form-label.required::after{content:" *";color:#ef4444}
.form-input,.form-select,.form-textarea{padding:.75rem 1rem;border:1px solid var(--color-border);border-radius:.75rem;font-family:inherit;font-size:.95rem;color:var(--color-text-primary);background:var(--color-bg-card);outline:none;transition:border-color .2s,box-shadow .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-shadow)}
.form-input.error,.form-select.error,.form-textarea.error{border-color:#ef4444;box-shadow:0 0 0 3px #fecdd3}
.form-textarea{resize:vertical;min-height:100px}
.form-error{font-size:.8rem;color:#ef4444;margin-top:.25rem}
/* SECTION PANELS */
.section-panel{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:1rem;margin-bottom:1.5rem;overflow:hidden}
.section-panel-title{font-size:1.1rem;font-weight:700;color:var(--color-text-primary);margin-bottom:1rem}
/* COLLAPSIBLE */
.collapsible-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;cursor:pointer;background:var(--color-bg-card);transition:background .2s;user-select:none}
.collapsible-header:hover{background:#f8fafc}
.collapsible-title{font-weight:700;font-size:.95rem;color:var(--color-text-primary);display:flex;align-items:center;gap:.5rem}
.collapsible-body{padding:1.25rem;border-top:1px solid var(--color-border)}
body.dark .collapsible-body{border-color:#334155}
.collapsible-arrow{transition:transform .2s;color:var(--color-text-muted)}
.collapsible.open .collapsible-arrow{transform:rotate(180deg)}
/* CHECKBOXES & RADIOS */
.check-group,.radio-group{display:flex;flex-wrap:wrap;gap:.5rem}
.check-label,.radio-label{display:flex;align-items:center;gap:.375rem;padding:.4rem .75rem;border:1px solid var(--color-border);border-radius:.5rem;cursor:pointer;font-size:.875rem;color:var(--color-text-secondary);transition:all .2s;user-select:none}
.check-label:hover,.radio-label:hover{border-color:var(--color-primary);color:var(--color-primary);background:var(--color-primary-light)}
.check-label input:checked+span,.radio-label input:checked+span{color:var(--color-primary);font-weight:600}
.check-label:has(input:checked),.radio-label:has(input:checked){border-color:var(--color-primary);background:var(--color-primary-light);color:var(--color-primary)}
.check-label input,.radio-label input{accent-color:var(--color-primary)}
/* TABS */
.tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.tab-btn{padding:.5rem 1.25rem;border-radius:.75rem;border:1px solid var(--color-border);background:var(--color-bg-card);color:var(--color-text-secondary);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}
.tab-btn.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
/* SCALES */
.scale-item{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:.75rem;padding:1rem;margin-bottom:.75rem}
.scale-item-title{font-weight:600;font-size:.9rem;color:var(--color-text-primary);margin-bottom:.5rem}
.scale-item-desc{font-size:.8rem;color:var(--color-text-muted);margin-bottom:.75rem}
.scale-options{display:flex;gap:.5rem;flex-wrap:wrap}
.scale-opt{display:flex;align-items:center;gap:.25rem;padding:.3rem .6rem;border:1px solid var(--color-border);border-radius:.5rem;cursor:pointer;font-size:.8rem;color:var(--color-text-secondary);transition:all .2s}
.scale-opt:has(input:checked){background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.scale-opt input{display:none}
.scale-score-box{background:linear-gradient(to bottom right,var(--color-primary),var(--color-primary-deep));color:#fff;border-radius:1rem;padding:1.5rem;text-align:center;margin-bottom:1.5rem}
.scale-score-num{font-size:3rem;font-weight:900;line-height:1}
.scale-score-label{font-size:1rem;opacity:.85;margin-top:.25rem}
.score-badge{display:inline-block;padding:.4rem 1rem;border-radius:9999px;font-size:.875rem;font-weight:700;margin-top:.5rem}
/* PTS */
.pts-row{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border:1px solid var(--color-border);border-radius:.75rem;background:var(--color-bg-card);margin-bottom:.5rem}
.goal-item{border:1px solid var(--color-border);border-radius:.75rem;padding:1rem;background:var(--color-bg-card);margin-bottom:.5rem;display:flex;gap:.75rem;align-items:flex-start}
.goal-text{flex:1;font-size:.95rem;color:var(--color-text-primary)}
/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:100%;gap:1rem}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1rem;padding:.25rem}
.chat-bubble{max-width:75%;padding:.875rem 1.125rem;border-radius:1.25rem;font-size:.95rem;line-height:1.6}
.chat-bubble-user{background:var(--color-primary);color:#fff;border-bottom-right-radius:.25rem;align-self:flex-end}
.chat-bubble-assistant{background:var(--color-bg-card);border:1px solid var(--color-border);color:var(--color-text-primary);border-bottom-left-radius:.25rem;align-self:flex-start}
.chat-meta{font-size:.75rem;color:var(--color-text-muted);margin-top:.25rem}
.chat-meta.right{text-align:right}
.chat-input-wrap{display:flex;gap:.75rem;padding:1rem;background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:1rem}
.chat-input{flex:1;border:1px solid var(--color-border);border-radius:.75rem;padding:.75rem 1rem;font-family:inherit;font-size:.95rem;color:var(--color-text-primary);background:var(--color-bg-content);outline:none;resize:none}
.chat-input:focus{border-color:var(--color-primary)}
.quick-chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.chip{padding:.4rem .875rem;border-radius:9999px;border:1px solid var(--color-border);background:var(--color-bg-card);color:var(--color-text-secondary);font-size:.8rem;cursor:pointer;transition:all .2s;font-family:inherit}
.chip:hover{border-color:var(--color-primary);color:var(--color-primary);background:var(--color-primary-light)}
/* UPLOAD */
.upload-zone{border:2px dashed var(--color-border);border-radius:1rem;padding:3rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--color-bg-card)}
.upload-zone:hover{border-color:var(--color-primary);background:var(--color-primary-light)}
.audit-item{border:1px solid var(--color-border);border-radius:.75rem;padding:1rem;background:var(--color-bg-card);margin-bottom:.75rem;display:flex;gap:1rem;align-items:center}
/* REPORT */
.report-preview{width:100%;min-height:400px;border:1px solid var(--color-border);border-radius:.75rem;padding:1.5rem;font-family:serif;font-size:1rem;line-height:1.8;color:var(--color-text-primary);background:var(--color-bg-card);resize:vertical;outline:none}
.report-preview:focus{border-color:var(--color-primary)}
/* TOAST */
.toast-container{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;flex-direction:column;gap:.5rem}
.toast{display:flex;align-items:center;gap:.75rem;padding:1rem 1.25rem;border-radius:.875rem;font-size:.9rem;font-weight:600;box-shadow:0 20px 40px rgba(0,0,0,.15);animation:slideIn .3s ease;min-width:260px}
.toast-success{background:#10b981;color:#fff}
.toast-error{background:#ef4444;color:#fff}
.toast-info{background:var(--color-primary);color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* SUMMARY */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:1rem;padding:1.25rem;display:flex;flex-direction:column;gap:.25rem}
.stat-value{font-size:2rem;font-weight:900;color:var(--color-primary)}
.stat-label{font-size:.875rem;color:var(--color-text-secondary)}
/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{position:fixed;height:100%;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .brand-block{display:none}
  .content{padding:1rem}
  .patients-grid{grid-template-columns:1fr}
}
/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
.overlay.open{display:block}
/* FADE TRANSITION */
.section-view{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* DISCLAIMER */
.disclaimer{background:#fffbeb;border:1px solid #fde68a;border-radius:.75rem;padding:1rem 1.25rem;font-size:.875rem;color:#92400e;display:flex;gap:.75rem;align-items:flex-start;margin-bottom:1rem}
body.dark .disclaimer{background:#1e1a0e;border-color:#78350f;color:#fbbf24}
/* DIVIDER */
.divider{height:1px;background:var(--color-border);margin:1.25rem 0}
/* LOG TABLE */
.log-table{width:100%;border-collapse:collapse}
.log-table th,.log-table td{padding:.75rem 1rem;text-align:left;border-bottom:1px solid var(--color-border);font-size:.875rem}
.log-table th{font-weight:700;color:var(--color-text-secondary);background:#f8fafc}
body.dark .log-table th{background:#1e293b}
.log-table tr:last-child td{border-bottom:none}
</style>
</head>
<body>
<div class="app">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="logo-btn" onclick="toggleSidebar()">
        <span class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" width="24" height="24"><path d="M12 21V3"></path><path d="M5 9c0 5 3.5 8 7 8s7-3 7-8"></path></svg>
        </span>
        <span class="logo-text">DRPsi</span>
      </button>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-footer" id="footerNav"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>
        </button>
        <h1 class="page-title" id="pageTitle">Anamnese</h1>
      </div>
      <div class="topbar-right">
        <div class="brand-block">
          <span class="brand-line">DRPSI — REGISTRO CLÍNICO ESTRUTURADO</span>
          <div class="brand-sub">
            <span class="brand-version">Versão 2.0</span>
            <div class="status-pill">
              <span class="status-dot"></span>

function buildNav(){

  });
  const foot=document.getElementById('footerNav');
  foot.innerHTML='';
  FOOTER_ITEMS.forEach(it=>{
    const b=document.createElement('button');

    b.onclick=()=>{

      else if(it.id==='privacidade')toast('Seus dados são armazenados localmente com criptografia AES-256.','info');
    };
    foot.appendChild(b);
  });
}

function navigate(id){

  renderSection();

  if(window.innerWidth<=768){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open');}

// ===================== TOAST =====================
function toast(msg,type='success'){
  const c=document.getElementById('toastContainer');

  t.className=`toast toast-${type}`;
  t.innerHTML=icon(type==='success'?'<path d="M20 6 9 17l-5-5"></path>':type==='error'?'<circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path>':'<circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>')+msg;
  c.appendChild(t);

}

// ===================== RENDER ROUTER =====================
function renderSection(){
  const c=document.getElementById('content');
  c.innerHTML='';
  const div=document.createElement('div');
  div.className='section-view';
  c.appendChild(div);
  switch(state.activeSection){
    case'anamnese':renderAnamnese(div);break;
    case'fenomenologia':renderFenomenologia(div);break;
    case'sumula':renderSumula(div);break;
    case'escalas':renderEscalas(div);break;
    case'diagnostico':renderDiagnostico(div);break;
    case'pts':renderPTS(div);break;
    case'relatorios':renderRelatorios(div);break;
    case'auditoria':renderAuditoria(div);break;
    case'assistente':renderAssistente(div);break;
    case'auditlog_view':renderAuditLog(div);break;
    default:div.innerHTML='<div class="empty-state">Seção em desenvolvimento.</div>';
  }
}

// ===================== ANAMNESE =====================
function calcAge(dob){
  const d=new Date(dob),n=new Date();
  let a=n.getFullYear()-d.getFullYear();
  if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;
  return a;
}
function fmtDate(d){if(!d)return'—';const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}

function renderAnamnese(container){
  if(state.activePatientId){
    renderAnamneseForm(container, state.patients.find(p=>p.id===state.activePatientId)||null);
    return;
  }
  const search=document.createElement('div');
  search.innerHTML=`
    <div class="content-head">
      <h2 class="content-title">Meus Pacientes</h2>
      <button class="btn btn-outline" onclick="toast('Sincronização P2P iniciada...','info')">

      </button>
      <button class="btn btn-primary" onclick="newPatient()">
        ${icon('<path d="M5 12h14"></path><path d="M12 5v14"></path>')} Novo Paciente
      </button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">${icon('<circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>')}</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Buscar por nome, diagnóstico, CID..." oninput="filterPatients(this.value)">
    </div>
    <div id="patientList" class="patients-grid"></div>`;
  container.appendChild(search);
  renderPatientList('');
}

function renderPatientList(q){
  const list=document.getElementById('patientList');
  if(!list)return;
  const filtered=state.patients.filter(p=>!q||p.nome.toLowerCase().includes(q.toLowerCase())||p.cid.toLowerCase().includes(q.toLowerCase())||p.queixa.toLowerCase().includes(q.toLowerCase()));
  if(filtered.length===0){list.innerHTML='<div class="empty-state" style="grid-column:1/-1">Nenhum paciente encontrado.</div>';return;}
  list.innerHTML=filtered.map(p=>`
    <div class="patient-card" onclick="openPatient('${p.id}')">
      <div class="patient-card-header">
        <div>
          <div class="patient-name">${p.nome}</div>
          <div class="patient-age">${calcAge(p.nascimento)} anos • ${p.sexo}</div>
        </div>
        <span class="badge badge-primary">${p.cid}</span>
      </div>
      <div class="patient-meta">
        <span class="patient-meta-item">${icon('<rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path>',14)} ${p.sessoes} sessões</span>
        <span class="patient-meta-item">${icon('<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>',14)} Última: ${fmtDate(p.ultimaSessao)}</span>
      </div>
      <div style="font-size:.85rem;color:var(--color-text-secondary);line-height:1.5">${p.queixa.substring(0,90)}${p.queixa.length>90?'...':''}</div>
    </div>`).join('');
}

function filterPatients(q){renderPatientList(q);}

function openPatient(id){

function saveAnamnese(id){
  const nome=document.getElementById('f_nome').value.trim();
  const nasc=document.getElementById('f_nasc').value;
  const qp=document.getElementById('f_qp').value.trim();
  if(!nome){document.getElementById('f_nome').classList.add('error');toast('Nome é obrigatório.','error');return;}
  if(!nasc){document.getElementById('f_nasc').classList.add('error');toast('Data de nascimento é obrigatória.','error');return;}
  if(!qp){document.getElementById('f_qp').classList.add('error');toast('Queixa principal é obrigatória.','error');return;}
  const data={
    id:id==='new'?'p'+Date.now():id,
    nome,nascimento:nasc,
    sexo:document.getElementById('f_sexo').value,
    escolaridade:document.getElementById('f_esc').value,
    profissao:document.getElementById('f_prof').value,
    estadoCivil:document.getElementById('f_ec').value,

function getFenoVal(sec,opt,type){
  if(!state.fenomenologia[sec])return false;
  if(type==='radio')return state.fenomenologia[sec]===opt;
  return Array.isArray(state.fenomenologia[sec])&&state.fenomenologia[sec].includes(opt);
}
function setFeno(sec,opt,type,checked){
  if(type==='radio'){state.fenomenologia[sec]=opt;}
  else{
    if(!Array.isArray(state.fenomenologia[sec]))state.fenomenologia[sec]=[];
    if(checked)state.fenomenologia[sec].push(opt);
    else state.fenomenologia[sec]=state.fenomenologia[sec].filter(x=>x!==opt);
  }
}

function switchScale(id,btn){

function renderScaleContent(){

  else if(activeScale==='hamd')c.innerHTML=renderHamScale('hamd',HAM_D,'Hamilton Depressão (HAM-D)',52,[0,7,17,24,52],['Normal','Leve','Moderada','Grave','Muito grave']);
  else if(activeScale==='gaf')c.innerHTML=renderGAF();
  else c.innerHTML=renderPANSS();

function calcScaleScore(key){
  const scores=scaleScores[key]||{};
  return Object.values(scores).reduce((a,v)=>a+(parseInt(v)||0),0);
}
function getInterpretation(score,thresholds,labels){
  for(let i=thresholds.length-1;i>=0;i--)if(score>=thresholds[i])return{label:labels[i],idx:i};
  return{label:labels[0],idx:0};
}
const BADGE_COLORS=['badge-success','badge-success','badge-warning','badge-error','badge-error'];

function renderHamScale(key,items,title,max,thresh,labels){
  const score=calcScaleScore(key);
  const interp=getInterpretation(score,thresh,labels);
  return`
    <div class="scale-score-box">
      <div class="scale-score-num">${score}</div>
      <div class="scale-score-label">${title} — Pontuação total (máx ${max})</div>
      <span class="score-badge ${BADGE_COLORS[interp.idx]}" style="margin-top:.75rem">${interp.label}</span>
    </div>
    ${items.map((it,i)=>`
    <div class="scale-item">
      <div class="scale-item-title">${i+1}. ${it.n}</div>
      <div class="scale-item-desc">${it.d}</div>
      <div class="scale-options">
        ${[0,1,2,3,4].map(v=>`
          <label class="scale-opt">
            <input type="radio" name="${key}_${i}" value="${v}" ${(scaleScores[key]||{})[i]==v?'checked':''} onchange="scaleScores['${key}'][${i}]=${v};document.getElementById('scaleContent').innerHTML=window['renderHamScale']('${key}',${key==='hama'?'HAM_A':'HAM_D'},'${title}',${max},[${thresh}],[${labels.map(l=>`'${l}'`)}])">
            <span>${v} — ${['Ausente','Leve','Moderado','Grave','Muito grave'][v]}</span>
          </label>`).join('')}
      </div>
    </div>`).join('')}
    <div style="text-align:right;margin-top:1rem">
      <button class="btn btn-primary" onclick="toast('Escala ${key.toUpperCase()} salva! Pontuação: ${score}','success')">Salvar Escala</button>
    </div>`;
}

function renderGAF(){
  const val=scaleScores.gaf||70;
  let interp=val>=91?'Funcionamento superior':val>=81?'Sintomas mínimos':val>=71?'Sintomas leves':val>=61?'Sintomas moderados':val>=51?'Sintomas graves':val>=41?'Algum prejuízo no teste de realidade':val>=31?'Comportamento influenciado por delírios':val>=21?'Perigo de machucar a si ou outros':val>=11?'Perigo persistente':' Informação inadequada';
  return`
    <div class="scale-score-box">
      <div class="scale-score-num">${val}</div>
      <div class="scale-score-label">GAF — Avaliação Global do Funcionamento (1–100)</div>
      <span class="score-badge badge-success" style="margin-top:.75rem">${interp}</span>
    </div>
    <div class="section-panel"><div style="padding:1.5rem">
      <div class="section-panel-title">Pontuação GAF</div>
      <p style="font-size:.9rem;color:var(--color-text-secondary);margin-bottom:1rem">Avalie o funcionamento geral do paciente. 100 = funcionamento ótimo; 1 = prejuízo extremo.</p>
      <input type="range" min="1" max="100" value="${val}" style="width:100%;accent-color:var(--color-primary)" oninput="scaleScores.gaf=parseInt(this.value);document.getElementById('scaleContent').innerHTML=window.renderGAF()">

      <div style="text-align:right;margin-top:1rem"><button class="btn btn-primary" onclick="toast('GAF salvo: ${val}','success')">Salvar GAF</button></div>

function addMeta(){
  const inp=document.getElementById('novaMeta');
  if(!inp.value.trim())return;
  if(!state.pts.metas)state.pts.metas=[];
  state.pts.metas.push({texto:inp.value.trim(),status:'Em andamento'});
  inp.value='';
  renderSection();
}
function removeMeta(i){state.pts.metas.splice(i,1);renderSection();}
function addMed(){
  if(!state.pts.medicamentos)state.pts.medicamentos=[];
  state.pts.medicamentos.push({nome:'',dose:'',freq:''});
  renderSection();
}
function removeMed(i){state.pts.medicamentos.splice(i,1);renderSection();}
function savePTS(){
  state.pts.terapia=document.getElementById('pts_terapia')?.value||'';
  state.pts.freq=document.getElementById('pts_freq')?.value||'';
  state.pts.modal=document.getElementById('pts_modal')?.value||'';
  state.pts.proximaConsulta=document.getElementById('pts_proxconsulta')?.value||'';
  saveState();
  toast('PTS salvo com sucesso!');
}

function renderAssistente(container){
  container.style.display='flex';
  container.style.flexDirection='column';
  container.style.height='100%';
  container.innerHTML=`
    <div class="content-head"><h2 class="content-title">Psi Assistente (IA)</h2></div>
    <div class="disclaimer">
      ${icon('<circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>',18)}
      <span><strong>Aviso:</strong> Este assistente é uma ferramenta de apoio clínico. Não substitui o julgamento médico profissional. Sempre valide as informações com fontes científicas atualizadas.</span>
    </div>
    <div class="quick-chips">
      <button class="chip" onclick="sendQuick('Qual o diagnóstico diferencial para quadro maníaco?')">Diagnóstico diferencial</button>
      <button class="chip" onclick="sendQuick('Quais os critérios DSM-5 para Transtorno Depressivo Maior?')">Critérios DSM-5</button>
      <button class="chip" onclick="sendQuick('Revise a prescrição de risperidona 4mg + sertralina 50mg')">Revisar prescrição</button>
      <button class="chip" onclick="sendQuick('Como fazer psicoeducação para paciente com TAG?')">Psicoeducação</button>
    </div>
    <div class="chat-messages" id="chatMessages" style="flex:1;overflow-y:auto">
      ${state.chatMessages.map(m=>chatBubbleHTML(m)).join('')}
    </div>
    <div class="chat-input-wrap" style="margin-top:1rem;flex-shrink:0">
      <textarea class="chat-input" id="chatInput" rows="2" placeholder="Digite sua pergunta clínica..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
      <button class="btn btn-primary" onclick="sendChat()">
        ${icon('<path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path>')}
      </button>
    </div>`;
  scrollChat();
}

function chatBubbleHTML(m){
  const isUser=m.role==='user';
  return`<div style="display:flex;flex-direction:column;align-items:${isUser?'flex-end':'flex-start'}">
    <div class="chat-bubble chat-bubble-${isUser?'user':'assistant'}">${m.text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</div>
    <div class="chat-meta ${isUser?'right':''}">${m.time}</div>
  </div>`;
}

const AI_RESPONSES=[
  'Com base na sua pergunta, os critérios diagnósticos relevantes incluem: duração dos sintomas, prejuízo funcional significativo e exclusão de causas orgânicas. Recomendo consultar as diretrizes atualizadas do DSM-5 e CID-11.',
  'Para esse quadro clínico, o diagnóstico diferencial deve incluir condições médicas gerais (hipertireoidismo, lesões neurológicas), uso de substâncias e outros transtornos psiquiátricos do Eixo I.',
  'A combinação farmacológica mencionada requer atenção ao intervalo QTc. Considere monitorização eletrocardiográfica e avaliação periódica de função hepática. Ajuste de dose conforme resposta clínica e tolerabilidade.',
  'Para a psicoeducação nesse caso, recomendo abordar: natureza e curso da doença, importância da adesão ao tratamento, identificação de gatilhos, estratégias de enfrentamento e suporte familiar.',
  'Segundo o DSM-5, os critérios diagnósticos incluem: (A) 5 ou mais sintomas durante 2 semanas; (B) prejuízo funcional; (C) exclusão de substâncias/condições médicas. A gravidade é classificada como leve, moderada ou grave.'
];

function sendChat(){
  const inp=document.getElementById('chatInput');
  if(!inp||!inp.value.trim())return;
  const text=inp.value.trim();
  const time=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  state.chatMessages.push({role:'user',text,time});
  inp.value='';
  const msgs=document.getElementById('chatMessages');
  if(msgs){msgs.innerHTML=state.chatMessages.map(m=>chatBubbleHTML(m)).join('');scrollChat();}
  setTimeout(()=>{
    const resp=AI_RESPONSES[Math.floor(Math.random()*AI_RESPONSES.length)];
    state.chatMessages.push({role:'assistant',text:resp,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
    const msgs2=document.getElementById('chatMessages');
    if(msgs2){msgs2.innerHTML=state.chatMessages.map(m=>chatBubbleHTML(m)).join('');scrollChat();}
    saveState();
  },1000);
}

function sendQuick(text){
  const inp=document.getElementById('chatInput');
  if(inp){inp.value=text;sendChat();}
}

function scrollChat(){
  setTimeout(()=>{const c=document.getElementById('chatMessages');if(c)c.scrollTop=c.scrollHeight;},50);
}
